<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="gcf1style.css">
</head>
<body>
    <h1 id="heading">Job Registration Form</h1>
    <div id="jehan">
        <label for="fullname">First Name</label>
<input type="text" id="Firstname" placeholder="Enter Your First Name">
<br>
<br>
 <label for="Last Name" id="center">Last Name</label>
<input type="text" id="lastname" placeholder="Enter Your last Name">
<br>
<br>
<label for="EMAIL">Email</label>
<input type="email" id="email" name="email" placeholder="Email">
<br>
<br>
<label for="password">password</label>
<input type="password" id="password" name="password" placeholder="Password">
<br><br>
<label for="dob">DOB</label>
<input type="date" id="Dob" name="dob">
<br><br>
<label for="time">Preferred Time:</label>
<input type="time" id="time" name="type">
<br><br>
<label for="month">Joining Month:</label>
<input type="month" id="month" name="month">
<br><br>
<label for="phone">Phone Number</label>
<input type="number" value="number" name="number">
<br><br>
<label for="gender">Gender</label>
<input type="radio" id="male" value="male" name="gender">Male
<input type="radio" id="female" value="female" name="gender">Female
<br>
<br>
<label for="training">Trained technologies</label>
<input type="checkbox" id="html" name="training" value="html">Html 
<input type="checkbox" id="css" name="training" value="css">css
<input type="checkbox" id="js" name="training" value="js">Jawa Script
<br><br>
<label for="resume">Upload Resume</label>
<input type="file" name="resume" value="resume">
<br><br>
<label class="done" for="submit"></label>
<input class="done" type="submit" value="submit" name="submit">
    </div>
</body>
</html>
