<!DOCTYPE html>
<html>
<head>
    <title>Job Registration Form</title>
    <link rel="stylesheet" href="formstyle.css">
</head>
<body>

<h1 id="center">Job Registration Form</h1>

<form>

    <label>Full Name:</label><br>
    <input type="text" name="fullname" required><br><br>

    <label>Email:</label><br>
    <input type="email" name="email" required><br><br>

    <label>Phone Number:</label><br>
    <input type="tel" name="phone" required><br><br>

    <label>Date of Birth:</label><br>
    <input type="date" name="dob"><br><br>

    <label>Gender:</label><br>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <input type="radio" name="gender" value="other"> Other
    <br><br>

    <label>Qualification:</label><br>
    <select name="qualification">
        <option>10th Pass</option>
        <option>12th Pass</option>
        <option>Graduate</option>
        <option>Post Graduate</option>
    </select><br><br>

    <label>Job Position Applying For:</label><br>
    <input type="text" name="position"><br><br>

    <label>Experience (in years):</label><br>
    <input type="number" name="experience" min="0"><br><br>

    <label>Upload Resume:</label><br>
    <input type="file" name="resume"><br><br>

    <label>Address:</label><br>
    <textarea name="address" rows="4" cols="30"></textarea><br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Clear">

</form>

</body>
</html>
